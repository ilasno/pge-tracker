[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pge-tracker"
version = "0.1.0"
description = "Personal PG&E energy usage tracker and analyzer"
requires-python = ">=3.10"

dependencies = [
    "opower>=0.16.0",
    "aiohttp>=3.8",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "flask>=3.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tzdata>=2023.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "freezegun>=1.2",
]

[project.scripts]
pge-tracker = "pge_tracker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pge_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
